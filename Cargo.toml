[package]
name = "inbox-mover"
version = "0.19.0"
edition = "2021"
authors = ["Stefan van Aalst"]
description = "Inbox Mover - Cross-platform transfer folder processor with GUI, TUI, and CLI in Rust"

[dependencies]
# GUI
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.29"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Serialization & JSON
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Files, Archives & Paths
zip = { version = "2.2", default-features = false, features = ["deflate", "bzip2", "time"] }
walkdir = "2.5"
glob = "0.3"
rfd = "0.15"
open = "5.3"
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utilities
crossbeam-channel = "0.5"

[lib]
name = "inbox_mover_core"
path = "src/lib.rs"

[[bin]]
name = "inbox-mover"
path = "src/bin/inbox-mover.rs"

[[bin]]
name = "inbox-mover-gui"
path = "src/bin/inbox-mover-gui.rs"

[[bin]]
name = "inbox-mover-tui"
path = "src/bin/inbox-mover-tui.rs"

[profile.release]
strip = true
lto = "thin"



